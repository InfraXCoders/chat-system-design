name: Deploy to VPS

# Runs on every push to main, and can be triggered manually from the Actions tab.
on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /root/chat-system-design
            git fetch --all
            git reset --hard origin/staging   # match the server exactly to GitHub
            docker compose up -d --build       # rebuild + restart changed services
            docker image prune -f              # clean up old dangling images
            docker compose ps
