<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ripple</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Join modal ──────────────────────────────────────── -->
  <div id="join-overlay">
    <div id="join-card">
      <div id="join-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="20" fill="#00A884"/>
          <path d="M20 8C13.4 8 8 13.4 8 20c0 2.1.5 4.1 1.5 5.8L8 32l6.4-1.5C16 31.5 18 32 20 32c6.6 0 12-5.4 12-12S26.6 8 20 8z" fill="white"/>
          <circle cx="15" cy="20" r="1.5" fill="#00A884"/>
          <circle cx="20" cy="20" r="1.5" fill="#00A884"/>
          <circle cx="25" cy="20" r="1.5" fill="#00A884"/>
        </svg>
      </div>
      <h1>Ripple</h1>
      <p>Real-time chat, built from scratch.</p>
      <div class="field">
        <label>Your name</label>
        <input id="username-input" type="text" placeholder="e.g. Alex" maxlength="24" />
      </div>
      <div class="field">
        <label>Room</label>
        <input id="room-input" type="text" placeholder="e.g. general" maxlength="32" value="general" />
      </div>
      <button id="join-btn">
        <span>Continue</span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- ── Main app ────────────────────────────────────────── -->
  <div id="app" class="hidden">

    <!-- Left sidebar -->
    <aside id="sidebar">

      <div id="sidebar-header">
        <div id="my-avatar" class="avatar"></div>
        <span id="my-name-label"></span>
        <div id="sidebar-actions">
          <button class="icon-btn" title="New chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div id="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="text" placeholder="Search chats" />
      </div>

      <!-- Open chats -->
      <div class="sidebar-section-label">Chats</div>
      <ul id="chat-list"></ul>

      <!-- People online in current room — click to DM -->
      <div class="sidebar-section-label">
        People in room
        <span id="online-count"></span>
      </div>
      <ul id="online-list"></ul>

    </aside>

    <!-- Right: chat panel -->
    <main id="chat-panel">

      <div id="empty-state">
        <div id="empty-icon">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="32" r="32" fill="#00A884" fill-opacity="0.08"/>
            <path d="M32 16C23.2 16 16 23.2 16 32c0 2.8.7 5.5 2 7.8L16 48l8.5-2c2.2 1.2 4.8 1.9 7.5 1.9 8.8 0 16-7.2 16-16S40.8 16 32 16z" fill="#00A884" fill-opacity="0.3"/>
            <circle cx="24" cy="32" r="2" fill="#00A884"/>
            <circle cx="32" cy="32" r="2" fill="#00A884"/>
            <circle cx="40" cy="32" r="2" fill="#00A884"/>
          </svg>
        </div>
        <h2>Ripple</h2>
        <p>Select a chat or click someone's name to start a DM.</p>
        <div id="tech-pills">
          <span>WebSockets</span><span>Redis pub/sub</span><span>PostgreSQL</span>
        </div>
      </div>

      <div id="active-chat" class="hidden">

        <div id="chat-header">
          <button id="back-btn" class="icon-btn" title="Back" aria-label="Back to chats">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M5 12l7 7M5 12l7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div id="chat-header-left">
            <div id="chat-avatar" class="avatar avatar-lg"></div>
            <div id="chat-info">
              <div id="chat-name"></div>
              <div id="chat-status"></div>
            </div>
          </div>
          <div id="chat-header-actions">
            <button class="icon-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="19" r="1.2" fill="currentColor"/></svg>
            </button>
          </div>
        </div>

        <div id="messages"></div>

        <div id="input-bar">
          <button class="icon-btn round-btn" title="Emoji">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M8.5 14.5s1.5 2 3.5 2 3.5-2 3.5-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="15" cy="10" r="1" fill="currentColor"/></svg>
          </button>
          <div id="input-wrap">
            <input id="message-input" type="text" placeholder="Type a message" autocomplete="off" />
          </div>
          <button id="send-btn" class="icon-btn round-btn send" title="Send">
            <svg id="send-icon" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22l-4-9-9-4 20-7z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" class="hidden"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
