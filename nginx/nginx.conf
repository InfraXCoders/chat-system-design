events { worker_connections 1024; }

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # ── Upstream — all Node.js instances ─────────────────────────────────────
  # When you add a second app instance (Step 4), just add another server line.
  # Nginx round-robins requests across all healthy upstreams automatically.
  upstream ripple_app {
    server app:3001;
    # server app2:3001;   ← uncomment in Step 4
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
  # Comment this block out if you don't have a domain yet — it will prevent
  # the app from loading over plain HTTP on your VPS IP.
  # server {
  #   listen 80;
  #   server_name yourdomain.com www.yourdomain.com;
  #   return 301 https://$host$request_uri;
  # }

  # ── Main server block (HTTP — change to HTTPS once cert is issued) ────────
  server {
    listen 80;
    server_name _;   # catches any hostname, including bare IP

    # Real client IP forwarded to Node.js (used by express-rate-limit)
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host              $host;

    # WebSocket upgrade headers — critical, without these ws:// connections fail
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Increase timeout — WebSocket connections stay open for minutes/hours
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
      proxy_pass http://ripple_app;
    }
  }

  # ── HTTPS block — uncomment after running Certbot ────────────────────────
  # server {
  #   listen 443 ssl;
  #   server_name yourdomain.com www.yourdomain.com;
  #
  #   ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
  #
  #   ssl_protocols       TLSv1.2 TLSv1.3;
  #   ssl_ciphers         HIGH:!aNULL:!MD5;
  #
  #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  #   proxy_set_header X-Forwarded-Proto https;
  #   proxy_set_header Host              $host;
  #   proxy_http_version 1.1;
  #   proxy_set_header Upgrade    $http_upgrade;
  #   proxy_set_header Connection "upgrade";
  #   proxy_read_timeout  3600s;
  #   proxy_send_timeout  3600s;
  #
  #   location / {
  #     proxy_pass http://ripple_app;
  #   }
  # }
}
